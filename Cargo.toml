[package]
name = "discord-rich-claude"
version = "0.1.0"
edition = "2024"
description = "Discord Rich Presence pour Claude Code"

[lib]
name = "discord_rich_claude"
path = "src/lib.rs"

[[bin]]
name = "discord-rich-claude"
path = "src/main.rs"

[features]
default = ["menu"]
menu = ["dep:tray-icon", "dep:tao", "dep:ctrlc"]

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
toml = "0.8"
chrono = "0.4"
similar = "2"
libc = "0.2"
log = "0.4"
tray-icon = { version = "0.19", optional = true }
tao = { version = "0.31", optional = true }
ctrlc = { version = "3", features = ["termination"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
